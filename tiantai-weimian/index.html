<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>天台未眠</title>
  <style>
    :root {
      --night: #0b0a2c;
      --night-2: #151047;
      --cyan: #36eaff;
      --coral: #ff7f92;
      --violet: #a76cff;
      --blue: #2f83ff;
      --cream: #fff2de;
      --white: #f8fbff;
      --muted: rgba(239, 246, 255, .7);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #08071f;
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    button { font: inherit; color: inherit; }

    .phone {
      position: relative;
      width: min(100vw, 390px);
      height: min(100dvh, 844px);
      min-height: 720px;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 78%, rgba(60, 95, 255, .2), transparent 32%),
        linear-gradient(180deg, #0e0b35 0%, #120e42 52%, #090922 100%);
      isolation: isolate;
    }

    .hero {
      position: absolute;
      inset: 0 0 auto;
      height: 48%;
      overflow: hidden;
      border-radius: 0 0 48px 30px;
      background-image:
        linear-gradient(180deg, rgba(8, 8, 39, .16) 0%, rgba(8, 8, 39, .12) 52%, rgba(8, 8, 39, .84) 100%),
        url("assets/rooftop-cobalt-reference.png");
      background-size: cover;
      background-position: center top;
      box-shadow: 0 24px 50px rgba(3, 3, 20, .38);
      cursor: pointer;
    }

    .hero:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: -4px;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 86% 20%, rgba(255, 134, 154, .2), transparent 22%),
        linear-gradient(90deg, rgba(7, 7, 34, .28), transparent 42%, rgba(7, 7, 34, .08));
    }

    .topbar {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: calc(env(safe-area-inset-top) + 14px) 18px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 760;
      letter-spacing: .04em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .34);
    }

    .brand-mark {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 9px 9px 9px 3px;
      color: #05091b;
      background: var(--cyan);
      box-shadow: 0 0 20px rgba(54, 234, 255, .55);
      font: 900 14px/1 Arial;
    }

    .top-actions { display: flex; gap: 9px; }
    .icon-btn {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 50%;
      background: rgba(9, 9, 41, .28);
      backdrop-filter: blur(10px);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    }

    .hero-copy {
      position: relative;
      z-index: 4;
      padding: 15px 20px 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      font-weight: 780;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.78);
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 2px;
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(54,234,255,.8);
    }

    h1 {
      margin: 11px 0 0;
      font-size: 40px;
      line-height: 1;
      letter-spacing: -.06em;
      font-weight: 900;
      text-shadow: 0 4px 24px rgba(0,0,0,.36);
    }

    .tagline {
      margin-top: 9px;
      color: rgba(255,255,255,.82);
      font-size: 13px;
      letter-spacing: .04em;
      text-shadow: 0 2px 12px rgba(0,0,0,.44);
    }

    .hero-firework-hint {
      position: absolute;
      z-index: 5;
      left: 20px;
      bottom: 22px;
      display: grid;
      grid-template-columns: 36px auto 18px;
      align-items: center;
      gap: 10px;
      min-width: 194px;
      padding: 7px 10px 7px 7px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(9,17,63,.58), rgba(22,26,85,.2));
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 26px rgba(4,7,35,.24), inset 0 0 0 1px rgba(54,234,255,.04);
      pointer-events: none;
    }

    .firework-orb {
      position: relative;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #152052;
      background: linear-gradient(145deg, #fff6d7, #8fefff 72%);
      box-shadow: 0 0 18px rgba(54,234,255,.38);
      font-size: 17px;
      animation: orbBreathe 2.4s ease-in-out infinite;
    }

    .firework-orb::before,
    .firework-orb::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff7cf;
      box-shadow: 0 -8px 0 #fff7cf, 7px -4px 0 var(--cyan), 8px 4px 0 #ffc98b, -7px 5px 0 #fff;
      animation: hintSpark 2.4s ease-out infinite;
    }

    .firework-orb::after { animation-delay: 1.2s; transform: rotate(40deg); }

    @keyframes orbBreathe { 50% { transform: scale(1.06); box-shadow: 0 0 25px rgba(54,234,255,.55); } }
    @keyframes hintSpark { 0%, 42% { opacity: 0; transform: scale(.2); } 58% { opacity: .9; } 100% { opacity: 0; transform: scale(1.15); } }

    .hero-firework-copy { display: flex; flex-direction: column; gap: 2px; }
    .hero-firework-copy b { color: white; font-size: 12px; line-height: 1.2; letter-spacing: .02em; }
    .hero-firework-copy small { color: rgba(255,255,255,.58); font-size: 9px; line-height: 1.2; }
    .hero-firework-arrow { color: rgba(255,255,255,.62); font-size: 20px; font-weight: 300; }

    .hero.fireworks-ready .hero-firework-hint {
      border-color: rgba(255,221,151,.44);
      background: linear-gradient(90deg, rgba(75,44,70,.64), rgba(26,33,90,.24));
    }

    .hero.fireworks-ready .firework-orb {
      background: linear-gradient(145deg, #fff8dd, #ffd18f 65%, #8beeff);
      box-shadow: 0 0 22px rgba(255,201,139,.52);
    }

    .hero-firework-hint::after {
      content: attr(data-charge);
      position: absolute;
      right: 18px;
      top: -9px;
      color: #fff4c8;
      font-size: 11px;
      font-weight: 850;
      opacity: 0;
      transform: translateY(5px) scale(.8);
      text-shadow: 0 0 12px rgba(255,211,139,.8);
      pointer-events: none;
    }

    .hero.charging .hero-firework-hint {
      border-color: rgba(255,239,190,.58);
      box-shadow: 0 10px 30px rgba(4,7,35,.28), 0 0 24px rgba(54,234,255,.2);
    }

    .hero.charging .firework-orb { animation: chargePop .62s cubic-bezier(.16,.82,.25,1); }
    .hero.charging .hero-firework-hint::after { animation: chargeNumber .72s ease-out both; }

    @keyframes chargePop {
      0% { transform: scale(.86); }
      44% { transform: scale(1.22) rotate(12deg); box-shadow: 0 0 32px rgba(255,225,155,.78); }
      100% { transform: scale(1); }
    }

    @keyframes chargeNumber {
      0% { opacity: 0; transform: translateY(7px) scale(.8); }
      28% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-18px) scale(1.05); }
    }

    .progress-wrap {
      position: relative;
      z-index: 4;
      margin: 12px 20px 0;
      padding: 2px 1px 7px;
    }

    .progress-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 7px;
      font-size: 10px;
      color: rgba(255,255,255,.68);
    }

    .progress-meta strong { color: white; font-size: 12px; }

    .progress-track {
      position: relative;
      height: 4px;
      border-radius: 99px;
      background: rgba(255,255,255,.2);
      overflow: visible;
    }

    .progress-value {
      width: 88%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), #70a4ff 55%, #ff93b7);
      box-shadow: 0 0 14px rgba(54,234,255,.7);
      transition: width .65s cubic-bezier(.2,.8,.2,1);
    }

    .progress-star {
      position: absolute;
      left: calc(88% - 6px);
      top: -5px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 7px white, 0 0 18px var(--cyan);
      transition: left .65s cubic-bezier(.2,.8,.2,1);
      animation: progressPulse 2s ease-in-out infinite;
    }

    @keyframes progressPulse { 50% { transform: scale(1.35); box-shadow: 0 0 10px white, 0 0 24px var(--cyan); } }

    .video-stage {
      position: relative;
      z-index: 3;
      height: 172px;
      margin: 11px 16px 0;
      overflow: hidden;
      border-radius: 15px 32px 23px 27px;
      background:
        linear-gradient(180deg, rgba(10,9,42,.04), rgba(10,9,42,.46)),
        url("assets/rooftop-night.png") center 24% / 128% auto;
      box-shadow: 0 18px 46px rgba(2, 2, 19, .5), inset 0 0 0 1px rgba(255,255,255,.13);
      transform: perspective(800px) rotate(-.35deg);
    }

    .video-stage::before,
    .video-stage::after {
      content: "";
      position: absolute;
      width: 110px;
      height: 4px;
      border-radius: 50%;
      background: linear-gradient(90deg, transparent, #ff8eaf 40%, #fff3e4 64%, transparent);
      filter: drop-shadow(0 0 5px rgba(255,128,164,.7));
      transform: rotate(18deg);
      animation: comet 4.8s linear infinite;
    }

    .video-stage::before { left: -120px; top: 33px; }
    .video-stage::after { left: -160px; top: 83px; animation-delay: 2.1s; }

    .video-stage.completed {
      background:
        radial-gradient(circle at 24% 35%, rgba(255,125,153,.46), transparent 18%),
        radial-gradient(circle at 72% 28%, rgba(54,234,255,.4), transparent 21%),
        linear-gradient(180deg, rgba(10,9,42,.03), rgba(10,9,42,.5)),
        url("assets/rooftop-night.png") center 24% / 128% auto;
      box-shadow: 0 18px 48px rgba(255,100,154,.16), inset 0 0 0 1px rgba(255,255,255,.2);
    }

    .video-stage.completed .play {
      box-shadow: 0 9px 22px rgba(0,0,0,.28), 0 0 0 7px rgba(54,234,255,.14), 0 0 24px rgba(54,234,255,.35);
    }

    @keyframes comet {
      0% { transform: translateX(0) translateY(0) rotate(18deg); opacity: 0; }
      14% { opacity: 1; }
      68% { opacity: .9; }
      100% { transform: translateX(520px) translateY(130px) rotate(18deg); opacity: 0; }
    }

    .video-kicker {
      position: absolute;
      left: 14px;
      bottom: 14px;
      font-size: 11px;
      color: rgba(255,255,255,.78);
    }

    .video-kicker b { display: block; margin-top: 2px; color: white; font-size: 15px; }

    .play {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.9);
      color: #151042;
      box-shadow: 0 9px 22px rgba(0,0,0,.28), 0 0 0 6px rgba(255,255,255,.11);
      cursor: pointer;
      transition: transform .2s ease;
    }

    .play:active { transform: scale(.92); }
    .play .pause-bars { display: none; letter-spacing: 1px; font-size: 11px; }
    .playing .play-triangle { display: none; }
    .playing .pause-bars { display: block; }

    .content-zone {
      position: absolute;
      z-index: 6;
      left: 0;
      right: 0;
      top: 48%;
      bottom: 0;
      padding: 99px 0 0;
    }

    .content-zone > .progress-wrap {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 12px;
      margin: 0;
      padding: 0 0 9px;
    }

    .phone.event-unlocked .content-zone { padding-top: 62px; }
    .phone.event-unlocked .content-zone > .progress-wrap { display: none; }
    .phone.event-unlocked .zone-head { top: 28px; }

    .content-zone::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 330px;
      height: 190px;
      right: -150px;
      top: 26px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,115,154,.18), transparent 66%);
      filter: blur(2px);
    }

    .zone-head {
      position: absolute;
      left: 20px;
      right: 18px;
      top: 68px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
    }

    .zone-head::after {
      content: "";
      flex: 1;
      height: 1px;
      opacity: .42;
      background: linear-gradient(90deg, rgba(54,234,255,.8), rgba(255,255,255,.08), transparent);
    }

    .zone-head strong {
      display: flex;
      align-items: center;
      padding: 0;
      background: none;
      color: rgba(255,255,255,.94);
      font-size: 14px;
      letter-spacing: .04em;
      transform: none;
      box-shadow: none;
    }

    .zone-head strong::before {
      content: "";
      width: 6px;
      height: 6px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(54,234,255,.72);
    }

    .zone-head span { display: none; }

    .portal-grid {
      position: relative;
      height: 100%;
      display: grid;
      grid-template-columns: 1.55fr .92fr;
      grid-template-rows: 1fr 1fr;
      gap: 0;
      overflow: hidden;
      isolation: isolate;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .portal-grid::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      background:
        radial-gradient(circle at 78% 18%, rgba(54,234,255,.13), transparent 26%),
        radial-gradient(circle at 14% 88%, rgba(244,180,92,.14), transparent 28%);
      pointer-events: none;
    }

    .portal-grid::after {
      content: "";
      position: absolute;
      z-index: 8;
      left: 61.5%;
      top: -12%;
      width: 2px;
      height: 128%;
      opacity: .25;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,.82) 25%, rgba(54,234,255,.58) 72%, transparent);
      transform: rotate(7deg);
      pointer-events: none;
    }

    .portal {
      position: relative;
      z-index: 1;
      overflow: hidden;
      border: 0;
      padding: 0;
      text-align: left;
      cursor: pointer;
      background: transparent;
      box-shadow: none;
      transition: transform .22s ease, filter .22s ease;
    }

    .portal:active { filter: brightness(1.13); }

    .stories {
      grid-row: 1 / 3;
      border-radius: 0;
      z-index: 3;
      width: calc(100% + 26px);
      padding-right: 26px;
      clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%);
      background:
        radial-gradient(circle at 82% 18%, rgba(244,194,116,.26), transparent 24%),
        linear-gradient(150deg, #2850ad 0%, #1d3989 46%, #101f5e 100%);
    }

    .stories::before {
      content: "";
      position: absolute;
      width: 205px;
      height: 154px;
      left: -48px;
      bottom: -37px;
      border-radius: 44% 56% 60% 40%;
      background: #17417f;
      transform: rotate(9deg);
      box-shadow: 96px -250px 0 -45px rgba(244,183,95,.18);
    }

    .tape {
      border-radius: 0;
      z-index: 2;
      margin-left: -10px;
      padding-left: 10px;
      clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%);
      background: linear-gradient(145deg, #3152a7 0%, #29458f 50%, #1b2e6c 100%);
      box-shadow: inset 0 -1px rgba(255,255,255,.18);
    }

    .tape::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 76% 16%, rgba(244,184,96,.18), transparent 34%),
        linear-gradient(180deg, rgba(54,234,255,.06), transparent 68%);
    }

    .guest {
      border-radius: 0;
      z-index: 2;
      margin-left: -10px;
      padding-left: 10px;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 10% 100%);
      background: linear-gradient(150deg, #1c6f9d 0%, #20528d 46%, #142d69 100%);
    }

    .guest::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 72% 18%, rgba(54,234,255,.22), transparent 42%);
    }

    .portal-label {
      position: absolute;
      z-index: 4;
      left: 16px;
      right: 12px;
      bottom: 15px;
    }

    .portal-label small {
      display: block;
      margin-bottom: 5px;
      font-size: 9px;
      color: rgba(255,255,255,.68);
    }

    .portal-label b {
      display: block;
      font-size: 25px;
      line-height: 1.04;
      letter-spacing: -.06em;
    }

    .tape .portal-label, .guest .portal-label { left: 24px; bottom: 11px; }
    .tape .portal-label b, .guest .portal-label b { font-size: 16px; letter-spacing: -.04em; }
    .tape .portal-label small, .guest .portal-label small { font-size: 8px; }

    .story-paper {
      position: absolute;
      width: 146px;
      height: 112px;
      top: 36px;
      left: 29px;
      padding: 14px;
      border-radius: 15px;
      color: #142759;
      background: #f5e6bd;
      transform: rotate(-3deg);
      box-shadow: 0 14px 28px rgba(13, 7, 59, .28);
    }

    .story-paper::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 9px -15px -7px 15px;
      border-radius: 13px;
      background: #b9d3ea;
      transform: rotate(8deg);
    }

    .story-paper::after {
      content: "";
      position: absolute;
      z-index: -2;
      inset: -8px 16px 15px -13px;
      border-radius: 13px;
      background: #edd9a8;
      transform: rotate(-6deg);
    }

    .avatar-row { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 760; }
    .avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f5bd69, #36d6e7 72%);
      border: 2px solid rgba(255,255,255,.85);
    }
    .paper-line { height: 4px; margin-top: 10px; border-radius: 8px; background: rgba(43,33,88,.16); }
    .paper-line.short { width: 65%; margin-top: 6px; }

    .story-sticker {
      position: absolute;
      z-index: 4;
      right: 24px;
      top: 164px;
      padding: 5px 8px;
      border-radius: 9px 9px 9px 2px;
      color: #14103e;
      background: var(--cyan);
      font-size: 9px;
      font-weight: 850;
      transform: rotate(-5deg);
      box-shadow: 0 7px 16px rgba(6,17,48,.25);
    }

    .stories .portal-label {
      left: 30px;
      right: 24px;
      bottom: 31px;
    }

    .stories .portal-label small {
      max-width: 165px;
      margin-bottom: 10px;
      font-size: 10px;
      line-height: 1.5;
    }

    .stories .portal-label b {
      font-size: 27px;
      line-height: 1.06;
    }

    .record {
      position: absolute;
      width: 88px;
      height: 88px;
      right: -14px;
      top: -15px;
      border-radius: 50%;
      background:
        radial-gradient(circle, #f6ca83 0 7%, #172552 8% 18%, #4dcfe2 19% 22%, #14204a 23% 48%, #304778 49% 51%, #101938 52% 100%);
      box-shadow: 0 12px 28px rgba(35,14,71,.34);
      animation: spin 9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .wave {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 2px;
      left: 13px;
      top: 22px;
      height: 26px;
    }

    .wave i {
      width: 2px;
      border-radius: 4px;
      background: rgba(255,255,255,.9);
      animation: pulse 1.2s ease-in-out infinite alternate;
    }

    .wave i:nth-child(1) { height: 8px; }
    .wave i:nth-child(2) { height: 20px; animation-delay: .18s; }
    .wave i:nth-child(3) { height: 13px; animation-delay: .32s; }
    .wave i:nth-child(4) { height: 25px; animation-delay: .1s; }
    .wave i:nth-child(5) { height: 11px; animation-delay: .25s; }
    @keyframes pulse { to { transform: scaleY(.45); opacity: .55; } }

    .guest-portrait {
      position: absolute;
      width: 90px;
      height: 122px;
      right: -7px;
      top: -2px;
    }
    .guest-portrait::before {
      content: "";
      position: absolute;
      width: 38px;
      height: 38px;
      right: 23px;
      top: 5px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffd7bc, #e89a9d);
      box-shadow: 0 0 0 8px rgba(54,234,255,.09);
    }
    .guest-portrait::after {
      content: "";
      position: absolute;
      width: 78px;
      height: 80px;
      right: 0;
      bottom: 0;
      border-radius: 48% 52% 8px 8px;
      background: linear-gradient(145deg, #4bc9df, #725ee0 70%);
      clip-path: polygon(15% 100%, 4% 42%, 26% 4%, 76% 5%, 97% 47%, 88% 100%);
    }

    .mini-play {
      position: absolute;
      z-index: 5;
      right: 12px;
      bottom: 14px;
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: white;
      color: #173f86;

    /* 本轮烟花状态入口 */

    /* 故事与声音：整卡划动 */
    .story-deck,
    .audio-deck {

    }

    .story-deck { height: 382px; }

    .story-deck::before,

    .audio-deck::before,

      content: "";

    .audio-card {
      padding: 17px 15px 19px;
      overflow: hidden;
      border: 1px solid rgba(194,216,255,.2);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(43,76,157,.66), rgba(27,43,111,.72));
      box-shadow: 0 18px 42px rgba(0,0,0,.2), inset 0 1px rgba(255,255,255,.06);
    }

    .story-card.dragging,
    .audio-card.dragging { transition: none; cursor: grabbing; }

    .story-card.swipe-left,
    .audio-card.swipe-left { animation: cardLeaveLeft .2s ease-in forwards; }
    .story-card.swipe-right,
    .audio-card.swipe-right { animation: cardLeaveRight .2s ease-in forwards; }
    .story-card.enter-left,
    .audio-card.enter-left { animation: cardEnterLeft .28s cubic-bezier(.2,.82,.24,1) both; }
    .story-card.enter-right,
    .audio-card.enter-right { animation: cardEnterRight .28s cubic-bezier(.2,.82,.24,1) both; }

    @keyframes cardLeaveLeft { to { opacity: .14; transform: translate3d(-112%,0,0); } }
    @keyframes cardLeaveRight { to { opacity: .14; transform: translate3d(112%,0,0); } }
    @keyframes cardEnterLeft { from { opacity: .18; transform: translate3d(-58%,0,0) scale(.97); } }
    @keyframes cardEnterRight { from { opacity: .18; transform: translate3d(58%,0,0) scale(.97); } }

    .story-position,
    .audio-position {

    }

    .overlay.mode-story .sheet { overflow: hidden; }
    .overlay.mode-story .demo-content { overflow: visible; }

    .audio-deck {
      margin: 4px -5px 0;
      padding: 0 5px;
    }

    .audio-card {
      padding: 4px 0 0;
    }

    /* 会客厅：语音房瀑布流 */
    .guest-room-section { padding: 22px 18px 34px; }
    .guest-room-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 12px; }
    .guest-room-head span { display: flex; flex-direction: column; gap: 3px; }
    .guest-room-head b { color: rgba(255,255,255,.9); font-size: 15px; }
    .guest-room-head small { color: rgba(255,255,255,.38); font-size: 9px; }
    .guest-room-head em { color: rgba(54,234,255,.7); font-size: 9px; font-style: normal; }

    .guest-room-masonry { column-count: 2; column-gap: 10px; }

      width: 100%;

    .guest-room-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 9px rgba(54,234,255,.6); }
    .guest-room-card strong { margin-top: 14px; color: white; font-size: 14px; line-height: 1.45; }
    .guest-room-speaking { margin-top: 8px; color: rgba(255,255,255,.36); font-size: 9px; }
    .guest-room-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 18px; }

    .guest-room-avatars i { width: 27px; height: 27px; margin-left: -7px; border: 2px solid rgba(20,31,50,.95); border-radius: 50%; background: linear-gradient(145deg, #43e7ee, #7354c2); }
    .guest-room-avatars i:nth-child(2) { background: linear-gradient(145deg, #ff9a9e, #e56880); }
    .guest-room-avatars i:nth-child(3) { background: linear-gradient(145deg, #b8a3ff, #6751b4); }
    .guest-room-online { color: rgba(255,255,255,.38); font-size: 9px; }

    /* 随声听悬浮播放器 */
    .floating-player {
      position: absolute;
      z-index: 80;
      right: 12px;
      bottom: 20px;
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      visibility: hidden;
      opacity: 0;
      transform: translateX(18px) scale(.92);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;
      background: rgba(10,15,47,.82);
      box-shadow: 0 12px 36px rgba(0,0,0,.35), 0 0 24px rgba(54,234,255,.08);
      backdrop-filter: blur(16px);
      transition: .28s ease;
    }
    .floating-player.show { visibility: visible; opacity: 1; transform: translateX(0) scale(1); }
    .floating-player-main { width: 100%; height: 100%; display: grid; place-items: center; padding: 0; border: 0; background: none; cursor: pointer; }
    .floating-vinyl { position: relative; width: 47px; height: 47px; flex: 0 0 auto; border-radius: 50%; background: repeating-radial-gradient(circle, #12183c 0 4px, #293a6b 5px 6px, #11152f 7px 10px); box-shadow: 0 0 0 2px rgba(54,234,255,.24), 0 0 18px rgba(54,234,255,.14); animation: spin 4.5s linear infinite; }
    .floating-vinyl::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: linear-gradient(145deg, #ffd38f, #66e9ff); }
    .floating-vinyl i { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; border-radius: 50%; background: #101634; transform: translate(-50%,-50%); }
    .floating-player.paused .floating-vinyl { animation-play-state: paused; opacity: .65; }
    .floating-player-copy { display: none; }
    .floating-player-copy b { color: white; font-size: 11px; }
    .floating-player-copy small { overflow: hidden; color: rgba(255,255,255,.48); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
    .floating-player-close { position: absolute; right: -4px; top: -5px; width: 22px; height: 22px; padding: 0; border: 1px solid rgba(255,255,255,.14); border-radius: 50%; background: rgba(8,12,39,.88); color: rgba(255,255,255,.7); cursor: pointer; font-size: 11px; }

    /* 烟花直播间 */
    .fireworks-close { position: absolute; z-index: 10; top: calc(env(safe-area-inset-top) + 72px); right: 16px; width: 32px; height: 32px; border: 1px solid rgba(255,255,255,.16); border-radius: 50%; background: rgba(8,15,47,.38); color: rgba(255,255,255,.78); backdrop-filter: blur(10px); cursor: pointer; }
    .identity-fireworks { position: absolute; z-index: 4; inset: 0; pointer-events: none; }
    .identity-firework { position: absolute; left: var(--x,50%); bottom: 18%; width: 68px; height: 68px; opacity: 0; transform: translate(-50%,0) scale(.35); animation: identityLaunch 3.8s ease-out forwards; }
    .identity-firework::before { content: ""; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: #fff7d7; box-shadow: 0 -48px 2px #fff7d7, 34px -34px 2px #ffd08e, 48px 0 2px #70efff, 34px 34px 2px #fff3c4, 0 48px 2px #ffbc79, -34px 34px 2px #63b9ff, -48px 0 2px #a2f5ff, -34px -34px 2px #ffd08e; filter: drop-shadow(0 0 6px rgba(255,244,197,.9)); transform: translate(-50%,-50%) scale(.1); animation: identityBurst 3.8s ease-out forwards; }
    .identity-badge { position: absolute; z-index: 2; left: 50%; top: 50%; display: flex; flex-direction: column; align-items: center; gap: 4px; transform: translate(-50%,-50%); opacity: 0; animation: identityBadge 3.8s ease-out forwards; }
    .identity-avatar { width: 31px; height: 31px; border: 2px solid rgba(255,255,255,.86); border-radius: 50%; background: var(--avatar, linear-gradient(145deg,#ff9a9e,#4e6bd8)); box-shadow: 0 0 16px rgba(54,234,255,.4); }
    .identity-name { max-width: 76px; overflow: hidden; color: white; font-size: 9px; text-shadow: 0 2px 8px rgba(0,0,0,.8); text-overflow: ellipsis; white-space: nowrap; }
    @keyframes identityLaunch { 0% { bottom: 8%; opacity: 0; transform: translate(-50%,0) scale(.25); } 28% { opacity: 1; } 56%,100% { bottom: var(--y,56%); opacity: 1; transform: translate(-50%,0) scale(1); } }
    @keyframes identityBurst { 0%,48% { opacity: 0; transform: translate(-50%,-50%) scale(.08); } 62% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.15); } }
    @keyframes identityBadge { 0%,54% { opacity: 0; transform: translate(-50%,-40%) scale(.72); } 66%,86% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-60%) scale(.92); } }

    .fireworks-live { bottom: 145px; height: 205px; right: 36px; }
    .fireworks-composer { position: absolute; z-index: 8; left: 14px; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 14px); padding: 10px 12px 11px; border: 1px solid rgba(255,255,255,.14); border-radius: 20px; background: rgba(7,14,46,.64); box-shadow: 0 12px 34px rgba(0,0,0,.28); backdrop-filter: blur(16px); }
    .fireworks-composer > b { display: block; margin: 0 2px 8px; color: rgba(255,255,255,.86); font-size: 12px; }
    .wish-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .wish-form input { min-width: 0; height: 38px; padding: 0 13px; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; outline: none; background: rgba(255,255,255,.08); color: white; font: inherit; font-size: 11px; }
    .wish-form input::placeholder { color: rgba(255,255,255,.4); }
    .wish-form input:focus { border-color: rgba(54,234,255,.55); box-shadow: 0 0 0 3px rgba(54,234,255,.08); }
    .wish-form button { height: 38px; padding: 0 17px; border: 0; border-radius: 999px; background: linear-gradient(135deg,#fff0d1,#9beeff); color: #152052; font-weight: 780; cursor: pointer; }
    .sync-moment { display: inline-flex; align-items: center; gap: 6px; margin: 8px 2px 0; color: rgba(255,255,255,.46); font-size: 9px; cursor: pointer; }
    .sync-moment input { width: 13px; height: 13px; margin: 0; accent-color: var(--cyan); }
    .fireworks-replay-note { position: absolute; z-index: 8; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px); display: none; min-width: 250px; padding: 12px 18px; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; background: rgba(7,14,46,.62); text-align: center; transform: translateX(-50%); backdrop-filter: blur(16px); }
    .fireworks-replay-note b { display: block; color: rgba(255,255,255,.88); font-size: 12px; }
    .fireworks-replay-note small { display: block; margin-top: 3px; color: rgba(255,255,255,.44); font-size: 9px; }
    .fireworks-overlay.replay-mode .fireworks-composer { display: none; }
    .fireworks-overlay.replay-mode .fireworks-replay-note { display: block; }
    .fireworks-overlay.replay-mode .fireworks-live { bottom: 78px; }
    .fireworks-overlay.replay-mode .presence-live { background: rgba(139,154,255,.16); color: rgba(202,210,255,.8); }

    .toast {
      position: absolute;
      z-index: 40;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 18px);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(8,8,33,.82);
      border: 1px solid rgba(54,234,255,.34);
      color: white;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: .28s ease;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,.34);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-height: 760px) {
      .hero { height: 48%; }
      .hero-copy { padding-top: 10px; }
      h1 { font-size: 33px; }
      .content-zone { top: 48%; padding-top: 89px; }
      .content-zone > .progress-wrap { top: 8px; }
      .zone-head { top: 60px; }
      .phone.event-unlocked .content-zone { padding-top: 58px; }
      .phone.event-unlocked .zone-head { top: 25px; }
      .portal-label b { font-size: 21px; }
      .tape .portal-label b, .guest .portal-label b { font-size: 15px; }
    }
  </style>
</head>

  <main class="phone" aria-label="Soul 天台：天台未眠">
    <section class="hero" id="heroTrigger">

        <i class="kv-star warm" style="--x:94%;--y:23%;--s:2px;--o:.76;--d:4.5s;--delay:-3s"></i>
        <i class="kv-star" style="--x:43%;--y:39%;--s:2px;--o:.68;--d:3.8s;--delay:-1.1s"></i>
        <i class="kv-star cyan" style="--x:35%;--y:17%;--s:2px;--o:.66;--d:5.2s;--delay:-3.6s"></i>

        <i class="kv-star warm" style="--x:53%;--y:46%;--s:3px;--o:.74;--d:4.6s;--delay:-.4s"></i>
        <i class="kv-star" style="--x:87%;--y:48%;--s:2px;--o:.62;--d:3.3s;--delay:-1.9s"></i>

      </header>

        <h1>天台未眠</h1>
        <div class="tagline" id="themeTagline">今晚，天台在等一场烟花。</div>
      </div>

      <button class="hero-firework-hint" id="heroFireworkHint" data-charge="" data-stop-hero type="button" aria-label="预约本轮烟花">
        <span class="firework-orb">✦</span>

  <script type="text/plain" id="legacyPrototypeScript">
    const progressNum = document.querySelector('#progressNum');
    const progressValue = document.querySelector('#progressValue');
    const progressStar = document.querySelector('#progressStar');
    const toast = document.querySelector('#toast');
    const progressCopy = document.querySelector('#progressCopy');
    const progressStatus = document.querySelector('#progressStatus');
    const themeTagline = document.querySelector('#themeTagline');
    const heroTrigger = document.querySelector('#heroTrigger');
    const heroFireworkHint = document.querySelector('#heroFireworkHint');
    const fireworkAction = document.querySelector('#fireworkAction');
    const fireworkHint = document.querySelector('#fireworkHint');
    const fireworksOverlay = document.querySelector('#fireworksOverlay');
    const fireworksLive = document.querySelector('#fireworksLive');
    const phone = document.querySelector('.phone');
    const overlay = document.querySelector('#overlay');
    const demoContent = document.querySelector('#demoContent');
    const closeSheet = document.querySelector('#closeSheet');
    const EVENT_UNLOCKED_KEY = 'soul-rooftop-fireworks-unlocked-v4';
    const EVENT_VIEWED_KEY = 'soul-rooftop-fireworks-viewed-v4';
    let eventUnlocked = localStorage.getItem(EVENT_UNLOCKED_KEY) === 'true';
    let hasViewedFireworks = localStorage.getItem(EVENT_VIEWED_KEY) === 'true';
    let progress = eventUnlocked ? 100 : 88;
    let toastTimer;
    let viewedTimer;
    let liveFeedTimer;
    let liveFeedKickTimer;
    let activeMediaTimer;
    let pendingFireworks = false;

    function syncProgress() {
      progressNum.textContent = progress;
      progressValue.style.width = `${progress}%`;
      progressStar.style.left = `calc(${progress}% - 6px)`;
      if (!eventUnlocked) {
        fireworkAction.textContent = progress >= 96 ? '就差最后一束' : `烟花蓄力中 · ${progress}%`;
        fireworkHint.textContent = '喜欢、评论或聆听，添一束火花';
      }
    }

    function setCompletedUI() {
      eventUnlocked = true;
      progress = 100;
      syncProgress();
      progressCopy.textContent = '18,646个人一起完成了这场烟花';
      progressStatus.innerHTML = '烟花已解锁&nbsp; <span id="progressNum">100</span>%';
      phone.classList.add('event-unlocked');
      themeTagline.textContent = hasViewedFireworks ? '今晚的烟花，可以随时回放。' : '全站烟花已经解锁。';
      fireworkAction.textContent = hasViewedFireworks ? '回放今晚烟花' : '全站共同解锁';
      fireworkHint.textContent = hasViewedFireworks ? '轻点主视觉，重新看见这一刻' : '点击观看今晚的烟花';
      heroTrigger.classList.add('fireworks-ready');
      heroTrigger.setAttribute('aria-label', '播放今晚烟花');
    }

    function contribute(amount = 2, message = '你为今晚的烟花添了一束火花') {
      if (eventUnlocked) {
        showToast('今晚烟花已解锁，轻点主视觉即可回放');
        return;
      }
      progress = Math.min(100, progress + amount);
      heroFireworkHint.dataset.charge = '+1束';
      heroTrigger.classList.remove('charging');
      void heroTrigger.offsetWidth;
      heroTrigger.classList.add('charging');
      setTimeout(() => heroTrigger.classList.remove('charging'), 760);
      syncProgress();
      showToast(message);
      if (navigator.vibrate) navigator.vibrate(18);

      if (progress === 100) {
        eventUnlocked = true;
        pendingFireworks = true;
        localStorage.setItem(EVENT_UNLOCKED_KEY, 'true');
        setCompletedUI();
        if (overlay.classList.contains('open')) {
          showToast('全站烟花已解锁，返回天台后观看');
        } else {
          setTimeout(() => {
            pendingFireworks = false;
            launchFireworks();
          }, 850);
        }
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function launchFireworks() {
      pendingFireworks = false;
      localStorage.setItem(EVENT_UNLOCKED_KEY, 'true');
      setCompletedUI();
      startLiveFeed();
      fireworksOverlay.classList.add('active');
      fireworksOverlay.setAttribute('aria-hidden', 'false');
      if (navigator.vibrate) navigator.vibrate([18, 45, 24]);
      clearTimeout(viewedTimer);
      viewedTimer = setTimeout(markFireworksViewed, 10000);
    }

    const liveMessages = [
      '阿眠发布了今晚的故事',
      '小野刚刚留下了一条评论',
      '晚风路过留下了一段声音',
      '树洞菌回复了一个睡不着的人',
      '岛屿听完了一段陌生人的声音',
      '十七正在天台看烟花',
      '椰子汽水喜欢了一篇故事',
      '白桃听完了今晚的留声',
      '凌晨三点加入了天台',
      '小满评论：今晚也辛苦了'
    ];

    function pushLiveMoment() {
      const note = document.createElement('div');
      note.className = 'live-note';
      note.dataset.tone = String(1 + Math.floor(Math.random() * 3));
      note.innerHTML = `<i class="live-avatar"></i><span>${liveMessages[Math.floor(Math.random() * liveMessages.length)]}</span>`;
      fireworksLive.prepend(note);
      while (fireworksLive.children.length > 5) {
        fireworksLive.lastElementChild.remove();
      }
    }

    function startLiveFeed() {
      clearInterval(liveFeedTimer);
      clearTimeout(liveFeedKickTimer);
      fireworksLive.innerHTML = '';
      pushLiveMoment();
      liveFeedKickTimer = setTimeout(pushLiveMoment, 420);
      liveFeedTimer = setInterval(pushLiveMoment, 1100);
    }

    function markFireworksViewed() {
      hasViewedFireworks = true;
      localStorage.setItem(EVENT_VIEWED_KEY, 'true');
      setCompletedUI();
    }

    function activateHeroFireworks() {
      if (eventUnlocked) {
        launchFireworks();
        return;
      }
      showToast('喜欢、评论或聆听内容，都能添一束火花');
    }

    heroTrigger.addEventListener('click', (event) => {
      if (event.target.closest('[data-stop-hero]')) return;
      activateHeroFireworks();
    });

    heroTrigger.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      activateHeroFireworks();
    });

    const experiences = {
      story: {
        author: '树洞菌',
        time: '23:48',
        long: true,
        line: '过了十点以后，城市像终于松了一口气。我坐在便利店门口，把今天没说出口的话一遍遍删掉。白天总觉得自己可以处理好所有事情，到了深夜才发现，情绪只是被暂时藏起来。其实也没有发生什么大事，只是突然很想有人问一句：你今天是不是有点累？可手机亮了又暗，最后还是我自己买了一瓶温牛奶，慢慢走回家。路上的风很轻，我想，也许长大就是学会一边难过，一边装作明天仍然值得期待。如果你也还没睡，希望你知道，今晚并不是只有你一个人被困在这些说不清的小情绪里。',
        meta: '3分钟前',
        action: '喜欢这个故事',
        next: '换一个'
      },
      audio: {
        tag: '00:26 · 今晚随机播放',
        line: '“如果你也还醒着，希望这段声音能陪你一会儿。”',
        meta: '来自一位陌生Soul用户',
        action: '播放这段声音',
        next: '下一段'
      },
      guest: {
        tag: '本期来访 · 访谈片段',
        line: '“你有没有一个只愿意在深夜回答的问题？”',
        meta: '天台会客厅 · 01:20',
        action: '播放访谈片段',
        next: '换片段'
      }
    };

    function renderExperience(type) {
      const item = experiences[type];
      if (type === 'audio') {
        renderAudioExperience();
        return;
      }
      if (type === 'guest') {
        renderGuestVideoPage();
        return;
      }

      demoContent.innerHTML = `
        <div class="experience-visual ${item.long ? 'long' : ''}">
          ${item.author ? `
            <div class="experience-author">
              <span class="experience-avatar" aria-hidden="true"></span>
              <b>${item.author}</b>
              <time>${item.time}</time>
            </div>` : `<span class="experience-tag">${item.tag}</span>`}
          <div class="experience-copy ${item.long ? 'long-story' : ''}">${item.line}</div>
          <span class="experience-meta">${item.meta}</span>
        </div>
        <div class="experience-actions">
          <button class="experience-action" type="button">♡ 喜欢</button>
          <button class="experience-comment" type="button">◌ 评论</button>
          <button class="experience-next" type="button">↻ 换一换</button>
        </div>`;

      const actionButton = demoContent.querySelector('.experience-action');
      const commentButton = demoContent.querySelector('.experience-comment');
      const nextButton = demoContent.querySelector('.experience-next');

      actionButton.addEventListener('click', () => {
        if (actionButton.classList.contains('done')) return;
        actionButton.classList.add('done');
        actionButton.textContent = '♥ 已喜欢';
        contribute(4, '已为全站烟花添上一束火花');
      });

      commentButton.addEventListener('click', () => {
        if (!commentButton.classList.contains('done')) {
          commentButton.classList.add('done');
          contribute(4, '评论入口已唤起，也为烟花添了一束火花');
          return;
        }
        showToast('评论入口已唤起');
      });

      nextButton.addEventListener('click', () => {
        const visual = demoContent.querySelector('.experience-visual');
        visual.animate(
          [{ opacity: .35, transform: 'translateX(8px)' }, { opacity: 1, transform: 'translateX(0)' }],
          { duration: 260, easing: 'ease-out' }
        );
      });
    }

    function renderAudioExperience() {
      const bars = [10,18,25,13,30,20,12,27,16,23,10,18,28,15,22,12,26,17,11]
        .map((height) => `<i style="--bar:${height}px"></i>`)
        .join('');

      demoContent.innerHTML = `
        <div class="audio-profile">
          <span class="audio-avatar" aria-hidden="true"></span>
          <b>晚风路过</b>
          <time>3分钟前</time>
          <div class="audio-tags"><span>上海</span><span>职场</span><span>有点迷茫</span></div>
        </div>
        <div class="audio-copy">
          <p>今天开完会之后，突然觉得自己好像一直在努力，但也不知道到底在往哪走。</p>
          <p>很想换工作，又怕只是从一个坑跳到另一个坑。</p>
        </div>
        <div class="audio-player">
          <button class="audio-play" type="button" aria-label="播放声音">▶</button>
          <div class="audio-waveform">${bars}</div>
          <span class="audio-duration">00:28</span>
        </div>
        <div class="audio-swipe">‹ &nbsp; 左右滑动，听听别人的今晚 &nbsp; ›</div>
        <div class="audio-actions">
          <button class="audio-listen" type="button">听听今晚</button>
          <button class="audio-record" type="button">留下我的声音</button>
        </div>`;

      const player = demoContent.querySelector('.audio-player');
      const playButton = demoContent.querySelector('.audio-play');
      const listenButton = demoContent.querySelector('.audio-listen');
      const recordButton = demoContent.querySelector('.audio-record');

      function toggleAudio() {
        player.classList.toggle('playing');
        playButton.textContent = player.classList.contains('playing') ? 'Ⅱ' : '▶';
        if (player.classList.contains('playing') && !player.dataset.contributed) {
          player.dataset.contributed = 'true';
          contribute(4, '这段声音为今晚添了一束火花');
        }
      }

      playButton.addEventListener('click', toggleAudio);
      listenButton.addEventListener('click', toggleAudio);
      recordButton.addEventListener('click', () => showToast('录音入口已唤起'));
    }

    function renderGuestVideoPage() {
      demoContent.innerHTML = `
        <div class="guest-video-stage">
          <button class="guest-video-play" type="button" aria-label="播放访谈视频">▶</button>
          <div class="guest-video-controls">
            <span class="guest-video-time">00:00</span>
            <span class="guest-video-progress"><i></i></span>
            <span>01:20</span>
          </div>
        </div>
        <div class="guest-video-info">
          <div class="guest-video-summary"><span>天台会客厅 · 本期访谈</span><small>01:20</small></div>
          <div class="guest-video-actions">
            <button class="guest-video-like" type="button">♡ 喜欢</button>
            <button class="guest-video-comment" type="button">◌ 评论</button>
            <button class="guest-video-share" type="button">↗ 分享</button>
          </div>
        </div>`;

      const stage = demoContent.querySelector('.guest-video-stage');
      const playButton = demoContent.querySelector('.guest-video-play');
      const time = demoContent.querySelector('.guest-video-time');
      const likeButton = demoContent.querySelector('.guest-video-like');
      let seconds = 0;

      playButton.addEventListener('click', () => {
        const playing = stage.classList.toggle('playing');
        playButton.textContent = playing ? 'Ⅱ' : '▶';
        clearInterval(activeMediaTimer);
        if (playing) {
          if (!stage.dataset.contributed) {
            stage.dataset.contributed = 'true';
            contribute(4, '观看访谈，也为烟花添了一束火花');
          }
          activeMediaTimer = setInterval(() => {
            seconds = Math.min(80, seconds + 1);
            time.textContent = `00:${String(seconds).padStart(2, '0')}`;
            if (seconds === 80) clearInterval(activeMediaTimer);
          }, 1000);
        }
      });

      likeButton.addEventListener('click', () => {
        if (likeButton.classList.contains('liked')) return;
        likeButton.classList.add('liked');
        likeButton.textContent = '♥ 已喜欢';
        contribute(4, '已为全站烟花添上一束火花');
      });

      demoContent.querySelector('.guest-video-comment').addEventListener('click', () => showToast('评论入口已唤起'));
      demoContent.querySelector('.guest-video-share').addEventListener('click', () => showToast('分享入口已唤起'));
    }

    document.querySelectorAll('.portal').forEach((portal) => {
      portal.addEventListener('click', () => {
        overlay.classList.remove('mode-story', 'mode-audio', 'mode-guest');
        overlay.classList.add(`mode-${portal.dataset.type}`);
        closeSheet.textContent = portal.dataset.type === 'guest' ? '‹' : '×';
        closeSheet.setAttribute('aria-label', portal.dataset.type === 'guest' ? '返回' : '关闭');
        renderExperience(portal.dataset.type);
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
      });
    });

    function closeOverlay() {
      clearInterval(activeMediaTimer);
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      if (pendingFireworks) {
        pendingFireworks = false;
        showToast('今晚的烟花正在升空');
        setTimeout(launchFireworks, 420);
      }
    }
    closeSheet.addEventListener('click', closeOverlay);
    overlay.addEventListener('click', (event) => { if (event.target === overlay) closeOverlay(); });

    document.querySelector('#closeFireworks').addEventListener('click', () => {
      clearInterval(liveFeedTimer);
      clearTimeout(liveFeedKickTimer);
      fireworksOverlay.classList.remove('active');
      fireworksOverlay.setAttribute('aria-hidden', 'true');
      markFireworksViewed();
    });

    document.querySelector('#replayFireworks').addEventListener('click', () => {
      markFireworksViewed();
      fireworksOverlay.classList.remove('active');
      void fireworksOverlay.offsetWidth;
      launchFireworks();
    });

    document.querySelectorAll('[data-stop-hero]').forEach((button) => {
      button.addEventListener('click', () => {
        showToast(button.getAttribute('aria-label') === '分享' ? '分享入口已唤起' : '已返回上一页');
      });
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (fireworksOverlay.classList.contains('active')) {
        document.querySelector('#closeFireworks').click();
      } else {
        closeOverlay();
      }
    });

    syncProgress();
    if (eventUnlocked) setCompletedUI();
  </script>

  <script>
    const $ = (selector, root = document) => root.querySelector(selector);
    const phone = $('.phone');
    const overlay = $('#overlay');
    const demoContent = $('#demoContent');
    const closeSheet = $('#closeSheet');
    const heroFireworkHint = $('#heroFireworkHint');
    const fireworkAction = $('#fireworkAction');
    const fireworkHint = $('#fireworkHint');
    const progressNum = $('#progressNum');
    const progressValue = $('#progressValue');
    const progressStar = $('#progressStar');
    const progressCopy = $('#progressCopy');
    const progressStatus = $('#progressStatus');
    const themeTagline = $('#themeTagline');
    const toast = $('#toast');
    const fireworksOverlay = $('#fireworksOverlay');
    const fireworksLive = $('#fireworksLive');
    const identityFireworks = $('#identityFireworks');
    const floatingPlayer = $('#floatingPlayer');
    const floatingPlayerTitle = $('#floatingPlayerTitle');

    const cycleId = (() => {
      const now = new Date();
      return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}-${now.getHours()}`;
    })();
    const CYCLE_STATE_KEY = 'soul-rooftop-cycle-v7';
    // Demo 体验：每次刷新都从本轮蓄力态重新开始。
    localStorage.removeItem(CYCLE_STATE_KEY);
    const storedCycle = {};

    let progress = storedCycle.id === cycleId ? Number(storedCycle.progress || 88) : 88;
    let reserved = storedCycle.id === cycleId && Boolean(storedCycle.reserved);
    let eventUnlocked = storedCycle.id === cycleId && Boolean(storedCycle.eventUnlocked);
    let hasViewedFireworks = storedCycle.id === cycleId && Boolean(storedCycle.hasViewedFireworks);
    let pendingFireworks = false;
    let toastTimer;
    let liveFeedTimer;
    let identityTimer;
    let activeMediaTimer;
    let storyIndex = 0;
    let audioIndex = 0;
    let storyBusy = false;
    let audioBusy = false;

    function persistCycle() {
      localStorage.setItem(CYCLE_STATE_KEY, JSON.stringify({
        id: cycleId,

    function bindCardDrag(deck, onSwipe) {
      const card = deck.querySelector('.story-card, .audio-card');
      let dragging = false;
      let startX = 0;
      let distance = 0;

      card.addEventListener('pointerdown', (event) => {
        if (event.target.closest('button')) return;
        dragging = true;
        startX = event.clientX;
        distance = 0;
        card.classList.add('dragging');
        if (card.setPointerCapture) card.setPointerCapture(event.pointerId);
      });

      card.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        distance = Math.max(-118, Math.min(118, event.clientX - startX));
        const fade = Math.max(.58, 1 - Math.abs(distance) / 270);
        card.style.transform = `translate3d(${distance}px,0,0)`;
        card.style.opacity = String(fade);
      });

      const finishDrag = (event) => {
        if (!dragging) return;
        dragging = false;
        card.classList.remove('dragging');
        if (card.releasePointerCapture && card.hasPointerCapture?.(event.pointerId)) card.releasePointerCapture(event.pointerId);

        if (Math.abs(distance) >= 54) {
          const direction = distance < 0 ? 1 : -1;
          card.style.transition = 'transform .22s cubic-bezier(.22,.74,.2,1), opacity .18s ease';
          card.style.transform = `translate3d(${direction > 0 ? '-112%' : '112%'},0,0)`;
          card.style.opacity = '.12';
          onSwipe(direction, card);
          return;
        }

        card.style.transition = 'transform .28s cubic-bezier(.2,.82,.2,1), opacity .22s ease';
        card.style.transform = 'translate3d(0,0,0)';
        card.style.opacity = '1';
        setTimeout(() => { card.style.transition = ''; }, 290);
      };

      card.addEventListener('pointerup', finishDrag);
      card.addEventListener('pointercancel', finishDrag);
    }

    overlay.addEventListener('click', event => { if (event.target === overlay) closeOverlay(); });
    document.querySelectorAll('[data-stop-hero]').forEach(button => {
      if (button === heroFireworkHint) return;
      button.addEventListener('click', () => showToast(button.getAttribute('aria-label') === '分享' ? '分享入口已唤起' : '已返回上一页'));
    });

    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      if (fireworksOverlay.classList.contains('active')) closeFireworks();
      else if (overlay.classList.contains('open')) closeOverlay();
    });

    const untilNextHour = 3600000 - (Date.now() % 3600000);
    setTimeout(() => {
      progress = 88;
      reserved = false;
      eventUnlocked = false;
      hasViewedFireworks = false;
      persistCycle();
      syncCycleUI();
      showToast('新一轮烟花蓄力开始了');
    }, untilNextHour);

    syncCycleUI();
  </script>
</body>
</html>
